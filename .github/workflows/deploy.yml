name: Test and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  id-token: write   # needed for OIDC auth to AWS
  contents: read

env:
  AWS_REGION: eu-west-2
  S3_BUCKET: school-scanner-web
  CLOUDFRONT_DIST_ID: E2NZ0O827VD30U

jobs:

  test-jest:
    name: Jest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/research/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions/research

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: functions/research

      - name: Run Jest unit tests
        run: npm test -- --testPathPatterns='handler'
        working-directory: functions/research

  test-pester:
    name: Pester tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -RequiredVersion 3.4.6
          Import-Module Pester
          $result = Invoke-Pester tests/SchoolScanner.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [test-jest, test-pester]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Attach security-headers policy to CloudFront
        run: |
          POLICY_ID=$(aws cloudformation describe-stacks \
            --stack-name schoolscanner \
            --query "Stacks[0].Outputs[?OutputKey=='SecurityHeadersPolicyId'].OutputValue" \
            --output text)

          DIST=$(aws cloudfront get-distribution-config --id ${{ env.CLOUDFRONT_DIST_ID }})
          ETAG=$(echo "$DIST" | jq -r '.ETag')
          CURRENT=$(echo "$DIST" | jq -r '.DistributionConfig.DefaultCacheBehavior.ResponseHeadersPolicyId // ""')

          if [ "$CURRENT" != "$POLICY_ID" ]; then
            UPDATED=$(echo "$DIST" | \
              jq ".DistributionConfig.DefaultCacheBehavior.ResponseHeadersPolicyId = \"$POLICY_ID\"" | \
              jq '.DistributionConfig')
            aws cloudfront update-distribution \
              --id ${{ env.CLOUDFRONT_DIST_ID }} \
              --distribution-config "$UPDATED" \
              --if-match "$ETAG"
            echo "Security headers policy attached: $POLICY_ID"
          else
            echo "Security headers policy already up to date."
          fi

      - name: Deploy frontend to S3
        run: aws s3 sync web/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

  smoke:
    name: Smoke test deployed Lambda
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/research/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions/research

      - name: Run smoke tests
        run: npm run test:smoke
        working-directory: functions/research
        env:
          LAMBDA_URL: https://ep6az35owvnis2c6n6wcl7axyy0elrlh.lambda-url.eu-west-2.on.aws/
