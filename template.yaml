AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: School Scanner API

Parameters:
  OpenAIApiKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /schoolscanner/openai_api_key
  OpenAIModel:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /schoolscanner/openai_model
  AdminKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /schoolscanner/admin_key

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel
        ADMIN_KEY: !Ref AdminKey
        OPENAI_REASONING_EFFORT: low
        OPENAI_MAX_TOKENS: '16000'
        OPENAI_BASE_URL: https://api.openai.com/v1

Resources:

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: schoolscanner-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              connect-src 'self' https://*.lambda-url.eu-west-2.on.aws;
              form-action 'self';
              base-uri 'self'
            Override: true

  ResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/research/index.handler
      Description: Handles POST /api/research requests
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "https://d3jaoys6w4aver.cloudfront.net"
            - "http://localhost:8080"
            - "http://127.0.0.1:8080"
          AllowMethods:
            - "*"
          AllowHeaders:
            - Content-Type
            - Accept

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/health/index.handler
      Description: Handles GET /api/health
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /api/health
            Method: get

  AnalyticsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: schoolscanner
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "log",
              "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Requests per day",
                "region": "${AWS::Region}",
                "view": "bar",
                "query": "SOURCE '/aws/lambda/schoolscanner-ResearchFunction' | filter event = 'research_request' | stats count() as requests by bin(1d)",
                "period": 86400
              }
            },
            {
              "type": "log",
              "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Status breakdown",
                "region": "${AWS::Region}",
                "view": "pie",
                "query": "SOURCE '/aws/lambda/schoolscanner-ResearchFunction' | filter event = 'research_request' | stats count() as requests by status",
                "period": 86400
              }
            },
            {
              "type": "log",
              "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Requests by branch",
                "region": "${AWS::Region}",
                "view": "pie",
                "query": "SOURCE '/aws/lambda/schoolscanner-ResearchFunction' | filter event = 'research_request' and status = 'completed' | stats count() as requests by branch",
                "period": 86400
              }
            },
            {
              "type": "log",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Latency (p50 / p90 / p99) ms",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "query": "SOURCE '/aws/lambda/schoolscanner-ResearchFunction' | filter event = 'research_request' and status = 'completed' | stats pct(ms, 50) as p50, pct(ms, 90) as p90, pct(ms, 99) as p99 by bin(1h)",
                "period": 3600
              }
            },
            {
              "type": "log",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Recent questions",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/lambda/schoolscanner-ResearchFunction' | filter event = 'research_request' and status = 'completed' | fields ts, branch, ms, question | sort ts desc | limit 20",
                "period": 86400
              }
            }
          ]
        }

Outputs:
  HealthUrl:
    Description: API Gateway health endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/health'
  SecurityHeadersPolicyId:
    Description: CloudFront response headers policy ID
    Value: !Ref SecurityHeadersPolicy
  DashboardUrl:
    Description: CloudWatch analytics dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=schoolscanner'
