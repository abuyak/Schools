AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: School Scanner API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        OPENAI_API_KEY: !Sub '{{resolve:ssm:/schoolscanner/openai_api_key}}'
        OPENAI_MODEL: !Sub '{{resolve:ssm:/schoolscanner/openai_model}}'
        OPENAI_REASONING_EFFORT: medium
        OPENAI_MAX_TOKENS: '8000'
        OPENAI_BASE_URL: https://api.openai.com/v1

Resources:

  ResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/research/index.handler
      Description: Handles POST /api/research requests
      Events:
        ResearchApi:
          Type: Api
          Properties:
            Path: /api/research
            Method: post

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/health/index.handler
      Description: Handles GET /api/health
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /api/health
            Method: get

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
