AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: School Scanner API

Parameters:
  OpenAIApiKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /schoolscanner/openai_api_key
  OpenAIModel:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /schoolscanner/openai_model

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 120
    MemorySize: 512
    Environment:
      Variables:
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel
        OPENAI_REASONING_EFFORT: low
        OPENAI_MAX_TOKENS: '4000'
        OPENAI_BASE_URL: https://api.openai.com/v1

Resources:

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: schoolscanner-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              connect-src 'self' https://*.lambda-url.eu-west-2.on.aws;
              form-action 'self';
              base-uri 'self'
            Override: true

  ResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/research/index.handler
      Description: Handles POST /api/research requests
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "https://d3jaoys6w4aver.cloudfront.net"
          AllowMethods:
            - "*"
          AllowHeaders:
            - Content-Type
            - Accept

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/health/index.handler
      Description: Handles GET /api/health
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /api/health
            Method: get

Outputs:
  HealthUrl:
    Description: API Gateway health endpoint
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/health'
  SecurityHeadersPolicyId:
    Description: CloudFront response headers policy ID
    Value: !Ref SecurityHeadersPolicy
